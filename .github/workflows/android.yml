name: Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android_build:
    runs-on: macos-14
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        submodules: true

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Setup NDK
      id: setup-ndk
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r27
        link-to-sdk: true
        add-to-path: true

    - name: Set NDK environment
      run: echo "ANDROID_NDK_HOME=${{steps.setup-ndk.outputs.ndk-path}}" >> $GITHUB_ENV

    - name: Cache dependencies
      id: cache
      uses: actions/cache@v4
      with:
        path: droidev
        key: droidev-${{ hashFiles('.github/workflows/android.yml', 'vcpkg/ports/**', 'vcpkg/triplets/**', 'vcpkg/*.json', '.git/modules/vcpkg/bin/HEAD') }}

    - name: Build dependencies
      if: ${{ steps.cache.outputs.cache-hit != 'true' }}
      run: python3 vcpkg/build_dependencies.py --archive arm64-android

    - name: Publish dependencies
      if: ${{ steps.cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' && github.event.repository.fork == false }}
      run: |
        curl -u "${{secrets.CIFTP}}" -s -T droidev.zip ftp://nvgt.dev
        curl -H "X-Auth: ${{secrets.CIPHP}}" -s "https://nvgt.dev/ci/devlibs_update.php"

    - name: Generate keystore for release
      if: github.event.repository.fork == false
      run: |
        cd jni
        echo "${{secrets.ANDROID_RUNNER_KEYSTORE}}" > android_enc.keystore
        cat android_enc.keystore | base64 -d > android.keystore
        echo "ANDROID_RUNNER_KEYSTORE_PW=${{secrets.ANDROID_RUNNER_KEYSTORE_PW}}" >> $GITHUB_ENV
        cd ..

    - name: Generate keystore for PR/fork
      if: github.event.repository.fork == true
      run: |
        cd jni
        keytool -genkey -keyalg RSA -keysize 2048 -v -keystore android.keystore -dname cn=NVGT-Android-CN -storepass Android1422207 -validity 10000 -alias app
        echo "ANDROID_RUNNER_KEYSTORE_PW=Android1422207">>$GITHUB_ENV
        cd ..

    - name: Build Android APK
      run: |
        cd jni
        ./gradlew assembleRunnerRelease AssembleStubRelease --no-daemon -Pandroid.injected.signing.store.file=android.keystore -Pandroid.injected.signing.store.password=${{env.ANDROID_RUNNER_KEYSTORE_PW}} -Pandroid.injected.signing.key.alias=app -Pandroid.injected.signing.key.password="${{env.ANDROID_RUNNER_KEYSTORE_PW}}"
        mv build/outputs/apk/runner/release/nvgt-runner-release.apk ../release/nvgt.apk
        cd ..

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: nvgt-android-apk
        path: release/nvgt.apk

    - name: Upload stub
      uses: actions/upload-artifact@v4
      with:
        name: nvgt-android-stub
        path: release/stub/nvgt_android.bin

  release:
    runs-on: ubuntu-latest
    needs: android_build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Download APK
      uses: actions/download-artifact@v4
      with:
        name: nvgt-android-apk
        path: artifacts

    - name: Set version
      run: |
        python3 build/ci_set_version.py
        echo "VERSION=$nvgt_version" >> $GITHUB_ENV

    - name: Rename APK
      run: |
        mkdir -p release
        mv artifacts/nvgt.apk release/nvgt_android_${{ env.VERSION }}.apk

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        body: |
          NVGT Android 汉化版 ${{ env.VERSION }}
          
          此版本完全保留了电脑版的所有功能，包括：
          - 完整的 Angelscript 脚本支持
          - 音频引擎 (SDL3 + miniaudio)
          - TTS 语音合成
          - 网络功能
          - 文件系统操作
          - 数据库支持
          - 物理引擎
          - 所有标准库和插件
          
          使用方法：
          1. 下载 APK 文件
          2. 安装到 Android 设备
          3. 享受与电脑版完全一致的体验
        files: release/nvgt_android_${{ env.VERSION }}.apk
        tag_name: android-${{ env.VERSION }}
        release_name: NVGT Android 汉化版 ${{ env.VERSION }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
