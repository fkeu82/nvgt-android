name: Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android_build:
    runs-on: macos-14
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Setup NDK
      id: setup-ndk
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r27
        link-to-sdk: true
        add-to-path: true

    - name: Set NDK environment
      run: echo "ANDROID_NDK_HOME=${{steps.setup-ndk.outputs.ndk-path}}" >> $GITHUB_ENV

    - name: Download pre-built droidev dependencies
      run: |
        curl -L -o droidev.zip https://nvgt.dev/droidev.zip
        unzip -q droidev.zip
        ls -la

    - name: Generate keystore
      run: |
        cd jni
        keytool -genkey -keyalg RSA -keysize 2048 -v -keystore android.keystore -dname cn=NVGT-Android-CN -storepass Android1422207 -validity 10000 -alias app
        cd ..

    - name: Build Android APK
      run: |
        cd jni
        chmod +x gradlew
        ./gradlew assembleRunnerRelease --no-daemon -Pandroid.injected.signing.store.file=android.keystore -Pandroid.injected.signing.store.password=Android1422207 -Pandroid.injected.signing.key.alias=app -Pandroid.injected.signing.key.password=Android1422207 --stacktrace
        mv build/outputs/apk/runner/release/nvgt-runner-release.apk ../release/nvgt.apk
        cd ..
        ls -la release/

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: nvgt-android-apk
        path: release/nvgt.apk

  release:
    runs-on: ubuntu-latest
    needs: android_build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Download APK
      uses: actions/download-artifact@v4
      with:
        name: nvgt-android-apk
        path: artifacts

    - name: Set version
      run: |
        VERSION=$(cat version)
        echo "VERSION=$VERSION" >> $GITHUB_ENV

    - name: Rename APK
      run: |
        mkdir -p release
        mv artifacts/nvgt.apk release/nvgt_android_${{ env.VERSION }}.apk

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        body: |
          NVGT Android 汉化版 ${{ env.VERSION }}
          
          此版本完全保留了电脑版的所有功能，包括：
          - 完整的 Angelscript 脚本支持
          - 音频引擎 (SDL3 + miniaudio)
          - TTS 语音合成
          - 网络功能
          - 文件系统操作
          - 数据库支持
          - 物理引擎
          - 所有标准库和插件
          
          使用方法：
          1. 下载 APK 文件
          2. 安装到 Android 设备
          3. 享受与电脑版完全一致的体验
        files: release/nvgt_android_${{ env.VERSION }}.apk
        tag_name: android-${{ env.VERSION }}
        release_name: NVGT Android 汉化版 ${{ env.VERSION }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
