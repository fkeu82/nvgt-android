name: release
on:
  workflow_dispatch:
  push:
    branches:
      - master
jobs:
  android_build:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        submodules: recursive
        fetch-depth: 0
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'
    
    - name: Setup NDK
      id: setup-ndk
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r27
        link-to-sdk: true
        add-to-path: true
    
    - name: set ndk environ
      run: echo "ANDROID_NDK_HOME=${{steps.setup-ndk.outputs.ndk-path}}" >> $GITHUB_ENV
    
    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: droidev
        key: droidev-${{ hashFiles('.github/workflows/release.yml') }}
      id: cache
    
    - name: download pre-built dependencies
      if: ${{ steps.cache.outputs.cache-hit != 'true' }}
      run: |
        # 下载 droidev.zip
        curl -L -o droidev.zip https://nvgt.dev/droidev.zip
        
        # 关键：先创建 droidev 目录，再解压进去
        mkdir -p droidev
        unzip -q droidev.zip -d droidev
        
        # 验证
        echo "=== droidev/lib 目录内容 ==="
        ls droidev/lib/
        
        if [ ! -f "droidev/lib/libtiny-aes-c.a" ]; then
          echo "ERROR: libtiny-aes-c.a 不存在！"
          exit 1
        fi
        echo "依赖验证成功！"
    
    - name: create release directory
      run: mkdir -p release
    
    - name: keystore
      run: |
        cd jni
        keytool -genkey -keyalg RSA -keysize 2048 -v -keystore android.keystore -dname cn=NVGT -storepass Android1422207 -validity 10000 -alias app
        echo "ANDROID_RUNNER_KEYSTORE_PW=Android1422207" >> $GITHUB_ENV
        cd ..
    
    - name: Fix gradlew permissions
      run: |
        cd jni
        chmod +x gradlew
    
    - name: build
      run: |
        cd jni
        ./gradlew assembleRunnerRelease AssembleStubRelease --no-daemon \
          -Dorg.gradle.jvmargs="-Xmx4g" \
          -Pandroid.injected.signing.store.file=android.keystore \
          -Pandroid.injected.signing.store.password=${{env.ANDROID_RUNNER_KEYSTORE_PW}} \
          -Pandroid.injected.signing.key.alias=app \
          -Pandroid.injected.signing.key.password="${{env.ANDROID_RUNNER_KEYSTORE_PW}}"
        mv build/outputs/apk/runner/release/nvgt-runner-release.apk ../release/nvgt.apk
        cd ..
    
    - name: upload
      uses: actions/upload-artifact@v4
      with:
        name: android-release
        path: 'release'

  release_apk:
    runs-on: ubuntu-latest
    needs: android_build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
    
    - name: Download APK
      uses: actions/download-artifact@v4
      with:
        name: android-release
        path: artifacts
    
    - name: Set version
      run: |
        VERSION=$(cat version)
        echo "VERSION=$VERSION" >> $GITHUB_ENV
    
    - name: Prepare release
      run: |
        mkdir -p release
        cp artifacts/nvgt.apk release/nvgt_android_${{ env.VERSION }}.apk
    
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        body: |
          NVGT Android 汉化版 ${{ env.VERSION }}
          
          此版本完全保留了电脑版的所有功能。
        files: release/nvgt_android_${{ env.VERSION }}.apk
        tag_name: android-${{ env.VERSION }}
        release_name: NVGT Android 汉化版 ${{ env.VERSION }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
